name: Bangun APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil berkas repositori
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Kumpulkan berkas aplikasi
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest sw.js lib icons www/

      - name: Pasang Capacitor dan buat proyek Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          echo '{"appId":"id.pribadi.pustaka","appName":"Perpustakaan Pribadi","webDir":"www","android":{"allowMixedContent":false}}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Pasang ikon aplikasi
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os, shutil
          src = Image.open('icons/icon-512.png').convert('RGBA')
          res = 'android/app/src/main/res'
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, s in sizes.items():
              p = res + '/mipmap-' + d
              os.makedirs(p, exist_ok=True)
              im = src.resize((s, s), Image.LANCZOS)
              for n in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                  im.save(p + '/' + n)
          print('ikon terpasang')
          PY

      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Unggah hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: Pustaka-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
